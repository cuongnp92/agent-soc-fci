[vms]
# Các VM đã có SSH key -> chỉ cần ansible_host, còn lại dùng default ở dưới
vm01 ansible_host=10.100.120.82
vm02 ansible_host=10.100.120.122
vm03 ansible_host=10.100.120.46

# Các VM CHƯA kịp đẩy key lên -> override lại dùng password riêng cho từng host này
vm04 ansible_host=10.100.120.35 ansible_ssh_pass="ChangeMe_35!" ansible_ssh_private_key_file=""
vm05 ansible_host=10.100.120.165 ansible_ssh_pass="ChangeMe_165!" ansible_ssh_private_key_file=""

[vms:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_connection=ssh
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
